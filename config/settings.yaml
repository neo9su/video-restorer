body_enhancement:
  enabled: true
  out_fmt: jpg
  position: after_upscale
  strength: 1.0
enhancement:
  denoise_strength: 1
  enabled: false
  model: RealESRGAN_x4plus
  tile_size: 0
extract_frames:
  format: png
  quality: 95
face_enhancement:
  enabled: true
  fidelity_weight: 0.7
  fullbody: false
  fullbody_fidelity: 0.9
  log_interval: 50
  only_center_face: false
io:
  frames_dir: ./frames
  input_dir: ./input
  keep_frames: false
  output_dir: ./output
postprocess:
  bitrate: ''
  color_enhance:
    brightness: 1.0
    contrast: 1.1
    enabled: false
    saturation: 1.2
  deshake: false
  output_codec: h264
  output_crf: 18
  output_fps: 0
  output_pix_fmt: yuv420p
preprocess:
  codec: h264
  crf: 18
  pix_fmt: yuv420p
  target_format: mp4
  target_fps: 0
server:
  gpu_id: 0
  num_workers: 4
  temp_dir: /tmp/video_restorer_temp
super_resolution:
  enabled: true
  model: realesr-animevideov3
  scale: 2
  tile_pad: 10
  tile_size: 0
watermark_removal:
  detect_watermark: false
  enabled: true
  method: lama
  text_removal:
    enabled: false
    lang: chi_sim+eng
  watermark_bbox: []
